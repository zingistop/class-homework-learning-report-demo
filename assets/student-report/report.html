<!doctype html>
<html lang="zh-CN">
<head>

  <title>沈佳彤单次作业学情与错因诊断报告</title>
  <style>
    *{box-sizing:border-box}

  <main class="page">
    <div class="crop report-header"><img src="original-report.png" alt="报告抬头"></div>

      <div class="rule"></div>
      <p class="summary">沈佳彤同学，本次作业共15题，已作答15题，其中正确12题、错误3题，正确率为80%。近3次同类型作业正确率由72%逐步提升至80%，连续两次上升，本次达到近3次最高水平。结合逐题诊断，当前错因主要涉及知识唤醒、建模转化和推演求解，具体如下：</p>
      <ul>
        <li><strong>知识唤醒：</strong>几何证明中的全等判定条件（见第4题）</li>
        <li><strong>建模转化：</strong>实际情境中的数量关系转化（见第1、3题）</li>
        <li><strong>推演求解：</strong>二次函数配方计算与结果检验（见第2、5题）</li>
      </ul>
    </section>
    <div class="crop diagnosis"><img src="original-report.png" alt="逐题诊断"></div>
  </main>
